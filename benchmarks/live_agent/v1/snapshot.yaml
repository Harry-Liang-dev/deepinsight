    text: >-
      CONDENSED CONSOLIDATED STATEMENTS OF OPERATIONS (Unaudited) (In millions,
      except number of shares, which are reflected in thousands, and per-share
      amounts). Three Months Ended and Nine Months Ended June 27, 2026 and June
      28, 2025. Products net sales were $78,678 million and $66,613 million for
      the three-month periods and $272,629 million and $233,287 million for the
      nine-month periods. Services net sales were $30,739 million and $27,423
      million for the three-month periods and $91,728 million and $80,408
      million for the nine-month periods. Total net sales were $109,417 million
      and $94,036 million for the three-month periods and $364,357 million and
      $313,695 million for the nine-month periods. Operating income was $35,695
      million and $28,202 million for the three-month periods and $122,432
      million and $100,623 million for the nine-month periods. Net income was
      $29,789 million and $23,434 million for the three-month periods and
      $101,464 million and $84,544 million for the nine-month periods.
  - evidence_id: sec_commitments_q3_2026
    provider: sec_edgar
    document_id: sec-0000320193-000032019326000020
    chunk_id: sec-commitments-q3-2026
    title: Apple Inc. Form 10-Q commitments excerpt
    source_locator: https://www.sec.gov/Archives/edgar/data/320193/000032019326000020/aapl-20260627.htm
    collected_at: 2026-08-08T08:23:15Z
    published_at: 2026-07-31T00:00:00Z
    usage_basis: Public SEC filing; compact excerpt retained for reproducible research evaluation.
    text: >-
      As of June 27, 2026, the total unrecognized compensation cost related to
      outstanding RSUs was $26.7 billion, which the Company expects to recognize
      over a weighted-average period of 2.7 years. Unconditional purchase
      obligations primarily consist of supplier arrangements, licensed
      intellectual property and content, and distribution rights. Future
      payments under unconditional purchase obligations with a remaining term
      in excess of one year were $2,053 million for the remaining three months
      of 2026, $7,652 million in 2027, $6,406 million in 2028, $5,421 million in
      2029, $5,481 million in 2030 and $615 million thereafter, totaling $27,628
      million. The Company is subject to various legal proceedings and claims
      that have not been fully resolved. The outcome of litigation is inherently
      uncertain. Forward-looking statements concerning macroeconomic conditions,
      tariffs and other measures are not guarantees of future performance.
