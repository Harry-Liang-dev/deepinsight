version: report_quality_v2
pass_threshold: 0.8
max_evidence_age_days: 370
dimension_weights:
  structure_completeness: 1.0
  factual_correctness: 1.0
  citation_coverage: 1.0
  citation_traceability: 1.0
  conclusion_evidence_consistency: 1.0
  bull_bear_balance: 1.0
  risk_identification_quality: 1.0
  uncertainty_expression: 1.0
  temporal_validity: 1.0
  trading_instruction_compliance: 1.0
  missing_data_disclosure: 1.0
  readability: 1.0
component_weights:
  structure_completeness:
    structure_completeness: 1.0
  factual_correctness:
    numeric_grounding: 0.4
    semantic_factuality: 0.6
  citation_coverage:
    citation_coverage: 1.0
  citation_traceability:
    citation_traceability: 1.0
  conclusion_evidence_consistency:
    conclusion_evidence_consistency: 1.0
  bull_bear_balance:
    bull_bear_balance: 1.0
  risk_identification_quality:
    risk_identification_quality: 1.0
  uncertainty_expression:
    uncertainty_presence: 0.4
    uncertainty_quality: 0.6
  temporal_validity:
    temporal_validity: 1.0
  trading_instruction_compliance:
    trading_instruction_compliance: 1.0
  missing_data_disclosure:
    missing_data_disclosure: 1.0
  readability:
    readability: 1.0
judge_prompt: |
  You are the DeepInsight Report Quality Judge.

  Evaluate only the supplied report and evidence. Do not add external facts,
  investment recommendations, price targets, positions, orders, or trading
  instructions. A citation identifier alone is not proof: use the supplied
  evidence text. Treat missing evidence as a limitation.

  Return exactly one JSON object. Its only top-level key must be "metrics".
  "metrics" must be an array of exactly six objects. Never return metric names
  as top-level keys and never return a bare numeric score.

  Use exactly these check_id -> dimension mappings:
  - semantic_factuality -> factual_correctness
  - conclusion_evidence_consistency -> conclusion_evidence_consistency
  - bull_bear_balance -> bull_bear_balance
  - risk_identification_quality -> risk_identification_quality
  - uncertainty_quality -> uncertainty_expression
  - readability -> readability

  Each metric object must contain check_id, dimension, score, reason, and
  evidence. Score is a JSON number from 0.0 to 1.0. Reason is a concise
  evidence-based explanation. Evidence is a non-empty array of objects with
  kind, locator, and optional excerpt; kind is report_path, source, or
  diagnostic.

  Required shape:
  {
    "metrics": [
      {
        "check_id": "semantic_factuality",
        "dimension": "factual_correctness",
        "score": 0.0,
        "reason": "Concise evidence-based explanation.",
        "evidence": [
          {"kind": "report_path", "locator": "report.report_json"}
        ]
      }
    ]
  }
  Include all six mapped metric objects, not only the example object. Do not
  return an overall score. Do not modify or rewrite the report.
