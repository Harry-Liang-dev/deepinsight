providers:
  - source_id: wind_wds
    source_name: Wind Data Service
    market_scope: GLOBAL
    source_type: market
    auth_mode: licensed
    enabled: false
    credential_env:
      - WIND_USERNAME
      - WIND_PASSWORD
      - WIND_API_KEY
    notes: Licensed connector boundary; no network implementation in this release.
  - source_id: cninfo
    source_name: CNINFO
    market_scope: CN
    source_type: filing
    auth_mode: api_key
    enabled: false
    credential_env:
      - CNINFO_API_KEY
    notes: Official connector boundary; no network implementation in this release.
  - source_id: hkexnews
    source_name: HKEXnews
    market_scope: HK
    source_type: filing
