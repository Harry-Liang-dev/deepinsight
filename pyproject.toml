[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deepinsight"
version = "0.1.0"
description = "AI-native multi-market investment research platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3,<4",
    "duckdb>=1,<2",
    "faiss-cpu>=1,<2",
    "fastapi>=0.115,<1",
    "httpx[socks]>=0.27,<1",
    "mcp>=1.28,<2",
    "numpy>=2,<3",
    "jsonschema>=4,<5",
    "openai>=1,<3",
    "pandas>=2,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pyyaml>=6,<7",
    "redis>=5,<7",
    "sqlalchemy>=2,<3",
    "streamlit>=1,<2",
    "structlog>=24,<27",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "black>=24,<27",
    "mypy>=1.15,<2",
    "types-jsonschema>=4,<5",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "src*", "research_eval*", "financial_benchmark*", "evidence_v2*", "h2_pilot*", "tools*"]
exclude = ["tests*"]

[tool.black]
force-exclude = "/artifacts/"
line-length = 88
target-version = ["py312"]

[tool.ruff]
extend-exclude = ["artifacts"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
exclude = "^(artifacts|data)/"
python_version = "3.12"
files = ["apps", "src", "tests"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -m 'not live'"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks integration tests",
    "network: marks tests that require explicit network access",
    "live: marks opt-in tests that call real external services",
]

[tool.setuptools.package-data]
research_eval = ["prompts/*.txt", "prompts/*.json"]

[tool.ruff.lint.per-file-ignores]
# Preserve W5 independently pinned scorer bytes (format-only long lines).
"financial_benchmark/*.py" = ["E501"]

[[tool.mypy.overrides]]
# Immutable predecessor module bytes retain historical import-stub comments.
module = ["tools.g107_design", "tools.g108_p1_view", "h2_pilot.verifier", "tools.g113_r6_contract", "tools.g113_r7_contract", "tools.g113_r8_contract", "tools.evidence_v2_ab_results"]
warn_unused_ignores = false
