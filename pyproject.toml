[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deepinsight"
version = "0.1.0"
description = "AI-native multi-market investment research platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3,<4",
    "duckdb>=1,<2",
    "faiss-cpu>=1,<2",
    "fastapi>=0.115,<1",
    "numpy>=2,<3",
    "openai>=1,<3",
    "pandas>=2,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pyyaml>=6,<7",
    "sqlalchemy>=2,<3",
    "streamlit>=1,<2",
    "structlog>=24,<27",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "black>=24,<27",
    "httpx>=0.27,<1",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "src*"]
exclude = ["tests*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["apps", "src", "tests"]
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks integration tests",
    "network: marks tests that require explicit network access",
]
